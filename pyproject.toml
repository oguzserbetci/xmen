[tool.poetry]
name = "xmen"
version = "1.0.7"
description = "An extensible toolkit for Cross-lingual (x) Medical Entity Normalization."
license = "Apache-2.0"
authors = ["Florian Borchert <florian.borchert@hpi.de>"]
readme = "README.md"
repository = "https://github.com/hpi-dhc/xmen"

[tool.poetry.scripts]
xmen = "xmen.cli.cli:main"

[tool.poetry.dependencies]
python = ">=3.9,<3.13" # Python 3.13 is not yet supported by scispaCy
datasets = "^2.0.0"
lxml = "^4.8.0"
transformers = "^4.17.0"
neleval = "^3.1.1"
numpy = ">=1.26,<2.0"
pytorch-metric-learning = "0.9.98.dev1"
sentencepiece = "^0.1.96"
protobuf = "^3.20.0"
omegaconf = "^2.3.0"
langcodes = "^3.3.0"
rich = "^12.3.0"
pandas = ">=2.2,<3.0"
torch = ">=1.13.0,!=2.0.1, !=2.1.0" # Some version don't seem to be compatible with Poetry
scispacy = "^0.6.2"
sentence-transformers = "^2.2.2"
faiss-cpu = "~1.8.0"
orjson = "^3.9.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
black = "^24.8.0"
hydra-core = "^1.3.2"
wandb = "^0.22.2"
hydra-submitit-launcher = "^1.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
extend-exclude = '''xmen/ext'''
